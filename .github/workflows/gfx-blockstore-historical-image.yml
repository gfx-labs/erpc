# gfx-labs fork only: publishes container images for feat/blockstore-historical
# and gfx-v* release tags to GHCR. Lives on the fork's main so the feature
# branch (upstream PR) never carries fork-specific CI.
#
# - Scheduled runs build the branch head and any gfx-v* tag that has no image yet.
# - Manual runs build a specific ref:
#     gh workflow run gfx-blockstore-historical-image.yml -f ref=gfx-v0.0.1
#
# Image tags:
#   branch           -> :blockstore-historical, :blockstore-historical-<sha12>
#   tag gfx-vX.Y.Z   -> :vX.Y.Z
name: gfx blockstore-historical image

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or gfx-v* tag to build
        default: feat/blockstore-historical
      force:
        description: Rebuild even if the image tag already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: gfx-blockstore-historical-image
  cancel-in-progress: false

env:
  SOURCE_BRANCH: feat/blockstore-historical
  TAG_PREFIX: gfx-v
  IMAGE: ghcr.io/gfx-labs/erpc

jobs:
  resolve:
    if: github.repository == 'gfx-labs/erpc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Plan builds
        id: plan
        env:
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          # Candidate refs: "<ref>\t<sha>"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ref="${INPUT_REF:-$SOURCE_BRANCH}"
            ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"
            # ^{} peels annotated tags to the commit they point at.
            sha="$(git ls-remote "$REPO_URL" "refs/tags/$ref^{}" | cut -f1)"
            [ -n "$sha" ] || sha="$(git ls-remote "$REPO_URL" "refs/tags/$ref" "refs/heads/$ref" | head -n1 | cut -f1)"
            [ -n "$sha" ] || { echo "::error::ref '$ref' not found"; exit 1; }
            candidates="$(printf '%s\t%s\n' "$ref" "$sha")"
          else
            branch_sha="$(git ls-remote "$REPO_URL" "refs/heads/$SOURCE_BRANCH" | cut -f1)"
            candidates="$(printf '%s\t%s\n' "$SOURCE_BRANCH" "$branch_sha")"
            # For each tag prefer the peeled (^{}) commit sha when present.
            tags="$(git ls-remote --tags "$REPO_URL" "refs/tags/${TAG_PREFIX}*" \
              | awk '{ r=$2; sub("refs/tags/","",r); p=sub(/\^\{\}$/,"",r); if (p || !(r in s)) s[r]=$1 } END { for (r in s) print r "\t" s[r] }')"
            [ -z "$tags" ] || candidates="$(printf '%s\n%s\n' "$candidates" "$tags")"
          fi

          matrix='[]'
          while IFS=$'\t' read -r ref sha; do
            [ -n "$ref" ] || continue
            if [[ "$ref" == "$TAG_PREFIX"* ]]; then
              version="v${ref#"$TAG_PREFIX"}"
              primary="$IMAGE:$version"
              tags="$primary"
            else
              version="blockstore-historical"
              primary="$IMAGE:blockstore-historical-${sha::12}"
              tags="$primary,$IMAGE:blockstore-historical"
            fi
            if [ "$FORCE" != "true" ] && docker buildx imagetools inspect "$primary" >/dev/null 2>&1; then
              echo "skip $ref ($sha): $primary exists"
              continue
            fi
            echo "build $ref ($sha) -> $tags"
            matrix="$(jq -c --arg ref "$ref" --arg sha "$sha" --arg version "$version" --arg tags "$tags" \
              '. + [{ref:$ref, sha:$sha, version:$version, tags:$tags}]' <<<"$matrix")"
          done <<<"$candidates"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$matrix")" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    name: publish ${{ matrix.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.tags }}
          build-args: |
            VERSION=${{ matrix.version }}
            COMMIT_SHA=${{ matrix.sha }}
