name: blockstore historical image

on:
  push:
    branches: [ci/blockstore-historical-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blockstore-historical-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'gfx-labs/erpc' && github.ref == 'refs/heads/ci/blockstore-historical-image'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: image
        run: echo "sha_tag=blockstore-historical-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gfx-labs/erpc:blockstore-historical
            ghcr.io/gfx-labs/erpc:${{ steps.image.outputs.sha_tag }}
          build-args: |
            VERSION=blockstore-historical
            COMMIT_SHA=${{ github.sha }}
